<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Let's Love password</title>
    <meta name="description" content="Create a new password for your Let's Love account." />
    <style>
      :root {
        color-scheme: light;
        --page: #f3f1fb;
        --card: #ffffff;
        --ink: #161114;
        --muted: #6f656b;
        --line: #ded8df;
        --field: #ffffff;
        --pink: #ff2a73;
        --rose: #ff415e;
        --orange: #ff7428;
        --soft-pink: #fff2f6;
        --focus: rgba(255, 42, 115, 0.18);
        --success-bg: #eefaf2;
        --success-ink: #17613a;
        --error-bg: #fff0f1;
        --error-ink: #ad2533;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(100%, 440px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(40, 32, 48, 0.08);
        padding: 38px 36px 34px;
      }

      .logo {
        width: 70px;
        height: 70px;
        display: block;
        margin: 0 auto 22px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 12px 28px rgba(255, 42, 115, 0.18);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(1.72rem, 5vw, 2.12rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .intro {
        max-width: 310px;
        margin: 12px auto 34px;
        color: var(--muted);
        text-align: center;
        font-size: 1rem;
        line-height: 1.38;
      }

      .loading {
        margin: 0;
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--muted);
        background: var(--soft-pink);
        text-align: center;
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: #393135;
        font-size: 0.95rem;
        font-weight: 500;
      }

      input {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 15px;
        color: var(--ink);
        background: var(--field);
        font: inherit;
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      input:focus {
        border-color: var(--pink);
        box-shadow: 0 0 0 5px var(--focus);
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.83rem;
        line-height: 1.35;
      }

      button {
        width: 100%;
        min-height: 54px;
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, var(--pink), var(--rose) 48%, var(--orange));
        box-shadow: 0 14px 26px rgba(255, 42, 115, 0.22);
        font: inherit;
        font-size: 1.02rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .message {
        margin: 0;
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--muted);
        background: var(--soft-pink);
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.48;
      }

      .message.success {
        color: var(--success-ink);
        background: var(--success-bg);
      }

      .message.error {
        color: var(--error-ink);
        background: var(--error-bg);
      }

      .support {
        margin: 22px 0 0;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }

      a {
        color: var(--pink);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 520px) {
        main {
          align-items: start;
          padding-top: 28px;
        }

        .card {
          border-radius: 16px;
          padding: 30px 22px 28px;
        }

        .logo {
          width: 64px;
          height: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Let's Love password reset">
        <img class="logo" src="/app-icon.png" alt="Let's Love" />
        <h1>Create new password</h1>
        <p class="intro" id="intro">Checking your secure reset link...</p>

        <p class="loading" id="loading">Please wait a moment.</p>

        <form id="reset-form" hidden>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required />
            <p class="hint">Password must contain at least 6 characters</p>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required />
            <p class="hint">Passwords must be identical</p>
          </div>

          <button id="submit" type="submit">Reset password</button>
        </form>

        <div id="result" class="message" hidden></div>
        <p class="support">Need help? Email <a href="mailto:support@jamsaq.in">support@jamsaq.in</a>.</p>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        confirmPasswordReset,
        getAuth,
        verifyPasswordResetCode,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");
      const isLocalPreview = params.get("preview") === "form"
        && ["localhost", "127.0.0.1"].includes(window.location.hostname);

      const app = initializeApp({
        apiKey: "AIzaSyB18kp2ICIEAA9tipEmALsX1oY0vtA3nyE",
        authDomain: "lets-love.firebaseapp.com",
        projectId: "lets-love",
        appId: "1:924802111357:web:261ae02ce90af855ab1e14",
      });
      const auth = getAuth(app);

      const intro = document.getElementById("intro");
      const loading = document.getElementById("loading");
      const form = document.getElementById("reset-form");
      const result = document.getElementById("result");
      const submit = document.getElementById("submit");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm-password");

      function showResult(message, variant = "info") {
        loading.hidden = true;
        result.hidden = false;
        result.textContent = message;
        result.className = `message ${variant}`.trim();
      }

      function getErrorCode(error) {
        return error?.code || error?.message || "unknown";
      }

      function showVerificationError(error) {
        const code = getErrorCode(error);
        console.error("[auth-action] Could not verify password reset code", error);
        intro.textContent = "This reset link could not be verified.";

        if (code.includes("api-key") || code.includes("unauthorized") || code.includes("requests-from-referer")) {
          showResult(`The reset page is not authorized to verify Firebase links yet. Please contact support and mention: ${code}.`, "error");
          return;
        }

        showResult(`The link has expired or was already used. Please request a new reset link from the app. (${code})`, "error");
      }

      if (isLocalPreview) {
        loading.hidden = true;
        form.hidden = false;
        intro.textContent = "Enter your new password below to complete the reset process";
      } else if (mode !== "resetPassword" || !oobCode) {
        intro.textContent = "This reset link is incomplete.";
        showResult("Please request a new password reset link from the Let's Love app.", "error");
      } else {
        verifyPasswordResetCode(auth, oobCode)
          .then(() => {
            loading.hidden = true;
            form.hidden = false;
            intro.textContent = "Enter your new password below to complete the reset process";
          })
          .catch(showVerificationError);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (isLocalPreview) {
          showResult("This is a local design preview. Use a real reset link from your email to update your password.", "info");
          return;
        }

        if (password.length < 6) {
          showResult("Password must be at least 6 characters.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showResult("Passwords do not match.", "error");
          return;
        }

        submit.disabled = true;
        submit.textContent = "Updating...";

        try {
          await confirmPasswordReset(auth, oobCode, password);
          form.hidden = true;
          intro.textContent = "Your password has been updated.";
          showResult("You can now sign in to the Let's Love app with your new password.", "success");
        } catch {
          showResult("Could not update your password. Please request a new reset link from the app.", "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Reset password";
        }
      });
    </script>
  </body>
</html>
